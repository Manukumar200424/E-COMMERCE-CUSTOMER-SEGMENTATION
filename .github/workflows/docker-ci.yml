name: CI - Build and Test Docker Container

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  python-test:
    name: Code & Model Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test application and model loading
        run: |
          python -c "import app; clustered, artifact, coords = app.prepare(); print('Model & data loaded successfully. Clusters:', len(artifact['labels']))"

  docker-build:
    name: Build & Test Docker Image
    needs: python-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ecommerce-customer-segmentation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name test-app ecommerce-customer-segmentation:latest
          sleep 5

      - name: Test Web Application Health
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/

      - name: Test API Statistics Endpoint
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/api/statistics

      - name: Stop and cleanup container
        if: always()
        run: |
          docker logs test-app
          docker stop test-app || true
          docker rm test-app || true
